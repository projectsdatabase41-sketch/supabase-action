name: Update Embeddings (all tables)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests openai

      - name: Run Embeddings Updater
        env:
          SUPABASE_URL_MY: ${{ secrets.SUPABASE_URL_MY }}
          SUPABASE_KEY_MY: ${{ secrets.SUPABASE_KEY_MY }}
          SUPABASE_PUB_URL: ${{ secrets.SUPABASE_PUB_URL }}
          SUPABASE_PUB_KEY: ${{ secrets.SUPABASE_PUB_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python update_embeddings.py
