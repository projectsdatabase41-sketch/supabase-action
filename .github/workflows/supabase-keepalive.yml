name: Supabase Keep-Alive (2 accounts)

on:
  schedule:
    # Каждые 3 дня в 03:00 UTC — с запасом от 7-дневного лимита
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}  # кнопка ручного запуска в Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: [1, 2]
    steps:
      - name: Ping Supabase project ${{ matrix.account }}
        run: |
          # Секреты подставляются динамически по номеру аккаунта
          eval "URL=\$SUPABASE_URL_${{ matrix.account }}"
          eval "KEY=\$SUPABASE_KEY_${{ matrix.account }}"
          eval "TABLE=\$SUPABASE_TABLE_${{ matrix.account }}"

          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${URL}/rest/v1/${TABLE}?select=id&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}")

          echo "Аккаунт ${{ matrix.account }} — HTTP статус: $response"
          cat /tmp/response.json

          if [ "$response" -ge 400 ]; then
            echo "::error::Пинг аккаунта ${{ matrix.account }} вернул ошибку $response"
            exit 1
          fi
        env:
          SUPABASE_URL_1: ${{ secrets.SUPABASE_URL_1 }}
          SUPABASE_KEY_1: ${{ secrets.SUPABASE_KEY_1 }}
          SUPABASE_TABLE_1: ${{ secrets.SUPABASE_TABLE_1 }}
          SUPABASE_URL_2: ${{ secrets.SUPABASE_URL_2 }}
          SUPABASE_KEY_2: ${{ secrets.SUPABASE_KEY_2 }}
          SUPABASE_TABLE_2: ${{ secrets.SUPABASE_TABLE_2 }}
